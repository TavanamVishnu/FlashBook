cat > admin.html << 'HTMLEOF'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FlashBook Admin</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 14px; font-size: 14px; font-weight: 600; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button { margin-top: 20px; width: 100%; padding: 10px; background: #111; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #333; }
  #result { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 14px; white-space: pre-wrap; display: none; }
  .ok { background: #e7f7ec; color: #1a7a3c; display: block !important; }
  .err { background: #fdeaea; color: #b3261e; display: block !important; }
</style>
</head>
<body>

<h1>Create an event</h1>

<label>Admin password</label>
<input id="password" type="password" placeholder="admin password">

<label>Event name</label>
<input id="name" type="text" placeholder="Friday Night Concert">

<label>Venue</label>
<input id="venue" type="text" placeholder="Main Arena">

<label>Event date/time</label>
<input id="event_time" type="datetime-local">

<div class="row">
  <div>
    <label>Rows</label>
    <input id="rows" type="number" value="5" min="1">
  </div>
  <div>
    <label>Columns</label>
    <input id="cols" type="number" value="8" min="1">
  </div>
</div>

<div class="row">
  <div>
    <label>VIP rows (from front)</label>
    <input id="vip_rows" type="number" value="1" min="0">
  </div>
  <div>
    <label>Premium rows (next)</label>
    <input id="premium_rows" type="number" value="2" min="0">
  </div>
</div>

<button onclick="submitEvent()">Create event</button>

<div id="result"></div>

<script>
const API_BASE = "http://127.0.0.1:8000";

async function submitEvent() {
  const resultEl = document.getElementById("result");
  resultEl.className = "";
  resultEl.textContent = "Creating...";
  resultEl.style.display = "block";

  const body = {
    name: document.getElementById("name").value,
    venue: document.getElementById("venue").value,
    event_time: document.getElementById("event_time").value,
    rows: parseInt(document.getElementById("rows").value, 10),
    cols: parseInt(document.getElementById("cols").value, 10),
    vip_rows: parseInt(document.getElementById("vip_rows").value, 10),
    premium_rows: parseInt(document.getElementById("premium_rows").value, 10),
  };

  try {
    const resp = await fetch(`${API_BASE}/admin/events`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Admin-Password": document.getElementById("password").value,
      },
      body: JSON.stringify(body),
    });

    const data = await resp.json();

    if (!resp.ok) {
      resultEl.className = "err";
      resultEl.textContent = `Error: ${data.detail || resp.statusText}`;
      return;
    }

    resultEl.className = "ok";
    resultEl.textContent = `Created! event_id: ${data.event_id}\ntotal_seats: ${data.total_seats}\n\nGo book it at book.html`;
  } catch (e) {
    resultEl.className = "err";
    resultEl.textContent = `Request failed: ${e}. Is the API running at ${API_BASE}?`;
  }
}
</script>

</body>
</html>
